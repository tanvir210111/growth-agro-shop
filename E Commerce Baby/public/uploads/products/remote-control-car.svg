<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad_remote-control-car" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accentGrad_remote-control-car" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad_remote-control-car)"/>
  
  <!-- Studio Pedestal -->
  <ellipse cx="300" cy="460" rx="180" ry="32" fill="#E2E8F0" opacity="0.7"/>

  <!-- Category & Brand Ribbon -->
  <rect x="40" y="40" width="130" height="28" rx="14" fill="#DC2626" opacity="0.15"/>
  <text x="105" y="58" fill="#DC2626" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">TOYS & GAMES</text>

  <rect x="430" y="40" width="130" height="28" rx="14" fill="#0F172A" opacity="0.06"/>
  <text x="495" y="58" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">GROWTH AGRO</text>

  <!-- Product Artwork -->
  <g id="productArtwork">
    <path d="M200 300 Q240 230 300 230 Q360 230 400 300 L420 340 L180 340 Z" fill="#EF4444" stroke="#991B1B" stroke-width="8"/>
      <circle cx="230" cy="350" r="28" fill="#1E293B" stroke="#64748B" stroke-width="6"/>
      <circle cx="370" cy="350" r="28" fill="#1E293B" stroke="#64748B" stroke-width="6"/>
      <line x1="280" y1="230" x2="250" y2="170" stroke="#1E293B" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Product Badge Pill -->
  <g transform="translate(300, 525)" filter="url(#cardShadow)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="white" stroke="#E2E8F0" stroke-width="2"/>
    <text x="0" y="5" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.75">2.4GHZ HIGH SPEED</text>
  </g>
</svg>