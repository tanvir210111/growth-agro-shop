<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="bgGrad_digital-thermometer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#EDF2F7"/>
    </linearGradient>
    <linearGradient id="accentGrad_digital-thermometer" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" rx="32" fill="url(#bgGrad_digital-thermometer)"/>
  
  <!-- Studio Pedestal -->
  <ellipse cx="300" cy="460" rx="180" ry="32" fill="#E2E8F0" opacity="0.7"/>

  <!-- Category & Brand Ribbon -->
  <rect x="40" y="40" width="130" height="28" rx="14" fill="#EF4444" opacity="0.15"/>
  <text x="105" y="58" fill="#EF4444" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.5">HEALTH</text>

  <rect x="430" y="40" width="130" height="28" rx="14" fill="#0F172A" opacity="0.06"/>
  <text x="495" y="58" fill="#475569" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" text-anchor="middle" letter-spacing="0.5">GROWTH AGRO</text>

  <!-- Product Artwork -->
  <g id="productArtwork">
    <path d="M280 130 L320 130 L315 320 L285 320 Z" fill="#F8FAFC" stroke="#DC2626" stroke-width="6"/>
      <circle cx="300" cy="350" r="28" fill="#DC2626"/>
      <rect x="288" y="220" width="24" height="45" fill="#0284C7"/>
  </g>

  <!-- Product Badge Pill -->
  <g transform="translate(300, 525)" filter="url(#cardShadow)">
    <rect x="-110" y="-18" width="220" height="36" rx="18" fill="white" stroke="#E2E8F0" stroke-width="2"/>
    <text x="0" y="5" fill="#0F172A" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" text-anchor="middle" letter-spacing="0.75">10S FAST READING</text>
  </g>
</svg>