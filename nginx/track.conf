# ==============================================================================
# Dedicated First-Party Tracking Hostname (Server-Side GTM)
# Domain: track.YOUR_DOMAIN
# Proxy Target: Docker Server GTM Container on http://127.0.0.1:8080
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name track.YOUR_DOMAIN;

    # Force HTTPS Redirect
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name track.YOUR_DOMAIN;

    # SSL Certificates (Managed by CloudPanel / Let's Encrypt / Certbot)
    # ssl_certificate /etc/letsencrypt/live/track.YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/track.YOUR_DOMAIN/privkey.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers for Dedicated Tracking Subdomain
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy to Server GTM Docker Container
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Preserve Client IP & Cookies (_fbp, _fbc, etc.)
        proxy_pass_request_headers on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
