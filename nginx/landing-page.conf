# ==============================================================================
# Production Nginx Reverse Proxy Configuration (CloudPanel / Ubuntu VPS)
# Domain: growthagro.shop & www.growthagro.shop
#
# ARCHITECTURE:
# 1. / (Root Demo Website)      -> 🔒 HTTP Basic Authentication Required
# 2. /products/* (Landing Pages) -> 🌐 PUBLIC (No Basic Auth)
# 3. /api/* (Order & Courier)    -> 🌐 PUBLIC (No Basic Auth - App/Bearer protected)
# 4. /admin/* (Landing Hub)      -> 🔒 Existing Admin Token / App Protection
# 5. /assets/* & /extracted_html/* -> 🌐 PUBLIC static dependencies
# ==============================================================================

# Rate Limiting Zone (Prevents DoS / Order Spam)
limit_req_zone $binary_remote_addr zone=api_order_limit:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=general_limit:10m rate=60r/s;

server {
    listen 80;
    listen [::]:80;
    server_name growthagro.shop www.growthagro.shop;

    # Redirect all HTTP traffic to HTTPS (Preserve SSL)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name growthagro.shop www.growthagro.shop;

    # SSL Certificates (Managed by CloudPanel / Let's Encrypt)
    # ssl_certificate /etc/letsencrypt/live/growthagro.shop/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/growthagro.shop/privkey.pem;

    # SSL Security Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/xml+rss application/atom+xml image/svg+xml font/woff2 font/woff;

    # Document Root (CloudPanel htdocs location)
    root /home/cloudpanel/htdocs/growthagro.shop;

    # Max Upload Payload Limit
    client_max_body_size 10M;

    # ==========================================================================
    # 1. PUBLIC LANDING PAGES (/products/*) - NO BASIC AUTH
    # ==========================================================================
    location /products/ {
        auth_basic off;
        limit_req zone=general_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ==========================================================================
    # 2. PUBLIC EXTRACTED HTML (/extracted_html/*) - NO BASIC AUTH
    # ==========================================================================
    location /extracted_html/ {
        auth_basic off;
        limit_req zone=general_limit burst=30 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ==========================================================================
    # 3. PUBLIC API ENDPOINTS (/api/*) - NO BASIC AUTH (Rate-limited)
    # ==========================================================================
    location /api/orders {
        auth_basic off;
        limit_req zone=api_order_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    location /api/ {
        auth_basic off;
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ==========================================================================
    # 4. PUBLIC STATIC ASSETS & PICTURES - NO BASIC AUTH (Prevents broken LP assets)
    # ==========================================================================
    location /assets/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        access_log off;
    }

    location /pic/ {
        auth_basic off;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        expires 30d;
        add_header Cache-Control "public, no-transform, max-age=2592000";
        access_log off;
    }

    # ==========================================================================
    # 5. EXISTING LANDING PAGE ADMIN (/admin/*) - APP AUTHENTICATION
    # ==========================================================================
    location /admin/ {
        auth_basic off; # Protected by application Bearer token / login credentials
        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ==========================================================================
    # 6. MAIN WEBSITE DEMO (ROOT /) - 🔒 HTTP BASIC AUTHENTICATION REQUIRED
    # ==========================================================================
    location / {
        auth_basic "Growth Agro Demo - Authorized Access Only";
        auth_basic_user_file /home/cloudpanel/htdocs/growthagro.shop/.htpasswd;

        limit_req zone=general_limit burst=20 nodelay;

        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
        proxy_connect_timeout 60s;
    }
}
